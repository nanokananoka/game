<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>NEON DUAL BEAT</title>
<style>html,body{margin:0;height:100%;background:#07070f;overflow:hidden}canvas{display:block;cursor:crosshair;touch-action:none}</style>
</head><body><canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const BPM=110,B=60/BPM,S8=B/2,BARS=17,KEYS=['a','s','d','f'];
const END=(BARS-1)*8*S8+1.5;
let ac,T0,scene='start',notes,targets,fx,jt,lit,trail,score,combo,maxc,cnt,mouse={x:0,y:0},btn=null;
const now=()=>ac?ac.currentTime-T0:0;
const mf=m=>440*Math.pow(2,(m-69)/12);

/* ---------- audio ---------- */
function noise(t,dur,type,f,v,dst){const s=ac.createBufferSource();s.buffer=nb;const q=ac.createBiquadFilter();q.type=type;q.frequency.value=f;const gn=ac.createGain();gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(q).connect(gn).connect(dst);s.start(t);s.stop(t+dur)}
function tone(t,f,dur,type,v,dst,f2){const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn).connect(dst);o.start(t);o.stop(t+dur+.02)}
let nb,master,seBus;
function initAudio(){
  if(ac)ac.close();
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=.6;master.connect(ac.destination);
  seBus=ac.createGain();seBus.gain.value=.5;seBus.connect(ac.destination);
  nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  T0=ac.currentTime+2.5;
  const ch=[[57,60,64],[53,57,60],[55,60,64],[55,59,62]];
  const KM=[30,62,94,126],AP=[[0,1,2,1,0,1,2,1],[0,2,1,2,0,2,1,2],[2,1,0,1,2,1,0,1],[0,1,2,3,2,1,0,1]];
  for(let s=0;s<=(BARS-1)*8;s++){
    const b=s>>3,sec=Math.min(3,b>>2),c=ch[b%4].concat(ch[b%4][0]+12),t=T0+s*S8,p=AP[sec][s%8];
    if(s==(BARS-1)*8){crash(t);tone(t,mf(c[0]-24),1.6,'sawtooth',.35,master);tone(t,150,.28,'sine',1,master,40);continue}
    if(KM.includes(s)){crash(t);tone(t,mf(c[0]-24),S8*3,'sawtooth',.4,master)}
    if(s%2==0)tone(t,150,.28,'sine',1,master,40);
    if(s%4==2){noise(t,.18,'bandpass',1800,.5,master);tone(t,190,.1,'triangle',.3,master)}
    noise(t,.04,'highpass',7000,s%2?.12:.2,master);
    tone(t,mf(c[p]+12+(sec>=2?12:0)),S8*.9,'square',.07,master);
    if(sec>=2)tone(t+S8/2,mf(c[(p+1)%4]+24),S8*.4,'square',.04,master);
    if(s%4==0||(sec>=1&&s%2==0))tone(t,mf(c[0]-24),S8*1.8,'sawtooth',.18,master);
  }
}
function crash(t){noise(t,1.4,'highpass',4000,.45,master)}
function se(f,v){const t=ac.currentTime;tone(t,f,.12,'square',v,seBus,f*1.5);tone(t,f*2,.2,'sine',v*.7,seBus)}
function seMiss(){tone(ac.currentTime,110,.15,'sawtooth',.2,seBus,60)}

/* ---------- chart ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(){
  const r=rng(7);notes=[];targets=[];let lane=0,side=0,px=null,py=null;
  const mk=t=>{
    const sw=(1-LF)/2*W,x0=side?W-sw+.02*W+R:.02*W+R,x1=side?W-.02*W-R:sw-.02*W-R;
    let x,y,k=0;do{x=x0+r()*(x1-x0);y=.12*H+R+r()*(.76*H-2*R)}while(px!=null&&Math.hypot(x-px,y-py)<120&&k++<20);
    const o={t,x,y,done:0,i:targets.length,px,py};targets.push(o);px=x;py=y;side^=1;return o};
  const nk=t=>{lane=(lane+1+Math.floor(r()*3))%4;const n={t,lane,done:0};notes.push(n);return n};
  const KM=new Set([30,62,94,126,128]);
  for(let s=8;s<=BARS*8-8;s++){
    const t=s*S8,b=s>>3,m=s%8,M=(b>>1)%2==1;
    if(KM.has(s)){const a=nk(t),o=mk(t);a.k=o.k=1;a.pair=o;o.pair=a;continue}
    if(b>=BARS-1)continue;
    if(KM.has(b*8+6)&&m>=5)continue;
    if(M){if(m%2==0)mk(t)}
    else{if(m%2==0){if(r()>.1)nk(t)}else if(m==5&&b>=3&&r()<.5)mk(t)}
  }
}

/* ---------- game ---------- */
function start(){applyCfg();initAudio();build();fx=[];jt=[];trail=[];lit=[0,0,0,0];score=combo=maxc=0;cnt={p:0,g:0,m:0};paused=false;resumeAt=0;scene='play'}
function spawn(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=60+Math.random()*220;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t0:performance.now(),l:500+Math.random()*300,col})}}
function judge(dt,x,y,col){
  const a=Math.abs(dt);let txt;
  if(a<=PW){cnt.p++;combo++;score+=1000+Math.min(combo,100)*10;txt='PERFECT';se(1320,.25);spawn(x,y,col,22)}
  else{cnt.g++;combo++;score+=600+Math.min(combo,100)*5;txt='GREAT';se(880,.2);spawn(x,y,col,12)}
  maxc=Math.max(maxc,combo);jt.push({txt,x,y,t0:performance.now(),col:a<=PW?'#fff7a8':'#7dffb0'});
}
function missed(x,y){cnt.m++;combo=0;seMiss();jt.push({txt:'MISS',x,y,t0:performance.now(),col:'#ff4d6d'})}
let FALL=1.1,APP=.9,R=60,PW=.05,GW=.1,LF=.3,ns=5,ts=5,jd=1,ofs=0,tbtn=null,tb=null,shakeT=-1e9,flashT=-1e9,paused=false,resumeAt=0,pb=null,rb=null,qb=null;
function applyCfg(){FALL=1.8-ns*.14;APP=1.4-ts*.1;[PW,GW]=[[.07,.13],[.05,.1],[.035,.07]][jd];LF=W<700?.5:.3;R=Math.min(60,(1-LF)/4*W-8,H*.13);try{localStorage.setItem('ndb',JSON.stringify([ns,ts,jd,ofs]))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem('ndb'));if(s){ns=s[0];ts=s[1];jd=s[2];ofs=s[3]|0}}catch(e){}
const TOUCH=matchMedia('(pointer:coarse)').matches;
function toTitle(){if(ac){ac.close();ac=null}paused=false;resumeAt=0;scene='start'}
function startClick(){for(const b of tbtn||[])if(mouse.x>b.x&&mouse.x<b.x+b.w&&mouse.y>b.y&&mouse.y<b.y+b.h){b.f();break}}
function tap(){const lx=(1-LF)/2*W,lw=LF*W;if(mouse.x>=lx&&mouse.x<lx+lw)keyHit(Math.min(3,Math.floor((mouse.x-lx)/(lw/4))));else clickHit()}
addEventListener('pointerup',()=>{if(ac&&ac.state=='suspended'&&!paused&&scene=='play')ac.resume()});
function startScreen(){
  const cx=W/2,st=Math.min(60,H*.11),y0=H*.3,bh=Math.min(40,st-8);tbtn=[];
  txt('NEON DUAL BEAT',cx,H*.16,Math.min(56,W/10),'#00f0ff');
  const rows=[['NOTE SPEED',ns,v=>ns=Math.max(1,Math.min(10,ns+v))],['TARGET SPEED',ts,v=>ts=Math.max(1,Math.min(10,ts+v))],['JUDGE',['EASY','NORMAL','HARD'][jd],v=>jd=(jd+v+3)%3],['OFFSET',(ofs>0?'+':'')+ofs+'ms',v=>ofs=Math.max(-100,Math.min(100,ofs+v*10))]];
  rows.forEach((r,i)=>{const y=y0+i*st;
    txt(r[0],cx-10,y+bh*.7,Math.min(22,W/22),'#c8d0e8','right',0);
    [[cx+4,'\u2212',-1],[cx+136,'+',1]].forEach(b=>{g.strokeStyle='#ff3df0';g.lineWidth=2;g.strokeRect(b[0],y,40,bh);txt(b[1],b[0]+20,y+bh*.72,24,'#ff3df0','center',0);tbtn.push({x:b[0],y,w:40,h:bh,f:()=>r[2](b[2])})});
    txt(r[1],cx+90,y+bh*.7,18,'#ffb000','center',0)});
  const by=y0+4*st+Math.min(40,H*.06),h=Math.min(54,H*.1);tbtn.push({x:cx-110,y:by,w:220,h,f:start});
  g.strokeStyle='#ffb000';g.lineWidth=3;g.shadowColor='#ffb000';g.shadowBlur=14;g.strokeRect(cx-110,by,220,h);g.shadowBlur=0;txt('START',cx,by+h*.68,28,'#ffb000');
  txt(TOUCH?'レーンと円ターゲットをタップ！（横向き推奨）':'A S D F キー × マウスクリック（レーンのクリックでもOK）',cx,by+h+30,14,'#8890a8','center',0);
}
function setPause(v){if(scene!='play'||!ac)return;if(v){if(paused){resumeAt=0;return}paused=true;resumeAt=0;ac.suspend()}else if(paused&&!resumeAt)resumeAt=performance.now()+3000}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
function kime(o){if(o.k&&o.pair.ok){shakeT=flashT=performance.now();se(1760,.3);tone(ac.currentTime,330,.5,'sawtooth',.2,seBus,80);spawn(W/2,.85*H,'#ffd84d',50);spawn(mouse.x,mouse.y,'#fff',40)}}
function keyHit(l){
  lit[l]=performance.now();const t=now()-ofs/1000;
  const n=notes.find(n=>!n.done&&n.lane==l&&Math.abs(n.t-t)<=GW);
  if(n){n.done=1;n.ok=1;const lw=LF*W/4;judge(t-n.t,(1-LF)/2*W+lw*(l+.5),.85*H,n.k?'#ffd84d':'#00f0ff');kime(n)}
}
function clickHit(){
  const t=now()-ofs/1000;let best=null;
  for(const o of targets)if(!o.done&&Math.abs(o.t-t)<=GW&&Math.hypot(o.x-mouse.x,o.y-mouse.y)<=R*1.5&&(!best||Math.abs(o.t-t)<Math.abs(best.t-t)))best=o;
  if(best){best.done=1;best.ok=1;judge(t-best.t,best.x,best.y,best.k?'#ffd84d':'#ff3df0');kime(best)}
}
addEventListener('keydown',e=>{if(scene!='play'||e.repeat)return;if(e.key=='Escape'||e.key.toLowerCase()=='p'){setPause(!paused);return}if(paused)return;const l=KEYS.indexOf(e.key.toLowerCase());if(l>=0)keyHit(l)});
function pos(e){const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top}
addEventListener('pointermove',e=>{pos(e);if(scene=='play')trail.push({x:mouse.x,y:mouse.y,t:performance.now()})});
addEventListener('pointerdown',e=>{
  if(e.button!=0)return;pos(e);
  if(scene=='start')startClick();
  else if(scene=='result'&&btn&&mouse.x>btn.x&&mouse.x<btn.x+btn.w&&mouse.y>btn.y&&mouse.y<btn.y+btn.h)start();
  else if(scene=='play'){const hit=b=>b&&mouse.x>b.x&&mouse.x<b.x+b.w&&mouse.y>b.y&&mouse.y<b.y+b.h;
    if(paused){if(resumeAt){}else if(hit(rb))setPause(false);else if(hit(qb))start();else if(hit(tb))toTitle();}
    else if(hit(pb))setPause(true);else tap()}
});

/* ---------- draw ---------- */
function txt(s,x,y,sz,col,al='center',glow){g.font=`bold ${sz}px "Segoe UI",Meiryo,sans-serif`;g.textAlign=al;g.fillStyle=col;g.shadowColor=glow||col;g.shadowBlur=glow===0?0:12;g.fillText(s,x,y);g.shadowBlur=0}
function bg(){g.fillStyle='#07070f';g.fillRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,'rgba(255,61,240,.07)');gr.addColorStop(.5,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(255,140,0,.07)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(255,255,255,.03)';g.lineWidth=1;for(let x=0;x<W;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}}
function frame(){
  bg();
  if(scene=='start'){startScreen();}else if(false){
    txt('NEON DUAL BEAT',W/2,H*.38,Math.min(64,W/10),'#00f0ff');
    txt('左手 A S D F  ×  右手 マウス',W/2,H*.5,Math.min(24,W/30),'#ff3df0');
    txt('CLICK TO START',W/2,H*.64,Math.min(32,W/22),'#ffb000');
    txt('※音が出ます。右の画面の円が縮んで重なる瞬間にクリック！',W/2,H*.74,14,'#8890a8','center',0);
  }else if(scene=='play')play();
  else if(scene=='result')result();
  requestAnimationFrame(frame);
}
function play(){
  const t=now(),lx=(1-LF)/2*W,lw=LF*W,ln=lw/4,hy=.85*H,P=performance.now();g.save();const sk=Math.max(0,1-(P-shakeT)/300);if(sk>0)g.translate((Math.random()-.5)*10*sk,(Math.random()-.5)*10*sk);
  g.fillStyle='rgba(0,240,255,.05)';g.fillRect(lx,0,lw,H);
  g.strokeStyle='#00f0ff';g.lineWidth=2;g.shadowColor='#00f0ff';g.shadowBlur=14;
  for(let i=0;i<=4;i++){g.beginPath();g.moveTo(lx+i*ln,0);g.lineTo(lx+i*ln,H);g.stroke()}
  g.shadowBlur=0;
  for(let i=0;i<4;i++){
    const a=Math.max(0,1-(P-lit[i])/250);
    if(a>0){const gr=g.createLinearGradient(0,hy-H*.5,0,hy);gr.addColorStop(0,'rgba(0,240,255,0)');gr.addColorStop(1,`rgba(0,240,255,${.55*a})`);g.fillStyle=gr;g.fillRect(lx+i*ln,hy-H*.5,ln,H*.5)}
    txt(KEYS[i].toUpperCase(),lx+ln*(i+.5),hy+50,22,'#00f0ff','center',0);
  }
  g.strokeStyle='#fff';g.lineWidth=3;g.shadowColor='#00f0ff';g.shadowBlur=16;g.beginPath();g.moveTo(lx,hy);g.lineTo(lx+lw,hy);g.stroke();g.shadowBlur=0;
  // notes
  for(const n of notes){
    if(n.done)continue;const dt=n.t-t;
    if(dt<-GW-ofs/1000){n.done=1;missed(lx+ln*(n.lane+.5),hy);continue}
    if(dt>FALL)continue;
    const y=hy-dt/FALL*hy;const kk=n.k;g.fillStyle=kk?'#ffe680':'#00f0ff';g.shadowColor=kk?'#ffd84d':'#00f0ff';g.shadowBlur=kk?28:14;g.fillRect(lx+n.lane*ln+(kk?2:6),y-(kk?13:9),ln-(kk?4:12),kk?26:18);g.shadowBlur=0;if(kk)txt('★ KIME',lx+ln*(n.lane+.5),y-22,14,'#ffd84d','center',0);
  }
  // mouse targets
  const vis=[];
  for(const o of targets){
    if(o.done)continue;const dt=o.t-t;
    if(dt<-GW-ofs/1000){o.done=1;missed(o.x,o.y);continue}
    if(dt<=APP)vis.push(o);
  }
  for(const o of vis){
    if(o.px!=null&&o.t-targets[o.i-1].t<1.0){
      const a=Math.min(1,(APP-(o.t-t))/.4)*.25;
      g.strokeStyle=`rgba(255,160,255,${a})`;g.lineWidth=2;g.setLineDash([6,8]);g.beginPath();g.moveTo(o.px,o.py);g.lineTo(o.x,o.y);g.stroke();g.setLineDash([])}
  }
  for(const o of vis){
    const p=1-(o.t-t)/APP,col=`hsl(${320-o.i*9%80+ (o.i%2?0:0)},100%,60%)`,c=`hsl(${(330+o.i*14)%360>40&&(330+o.i*14)%360<300?330:(330+o.i*14)%360},100%,60%)`;
    const al=Math.min(1,p*3);g.globalAlpha=al;
    g.fillStyle=o.k?'rgba(255,216,77,.22)':'rgba(255,61,240,.15)';g.strokeStyle=o.k?'#ffd84d':o.i%3==0?'#ff8c00':'#ff3df0';g.lineWidth=o.k?6:4;g.shadowColor=g.strokeStyle;g.shadowBlur=16;
    g.beginPath();g.arc(o.x,o.y,R,0,7);g.fill();g.stroke();
    g.lineWidth=o.k?5:3;g.strokeStyle=o.k?'#fff':'#ffd0a0';g.beginPath();g.arc(o.x,o.y,R*(1+(1-p)*1.5),0,7);g.stroke();
    g.shadowBlur=0;g.globalAlpha=1;
  }
  // trail
  while(trail.length&&P-trail[0].t>300)trail.shift();
  for(let i=1;i<trail.length;i++){const a=1-(P-trail[i].t)/300;g.strokeStyle=`rgba(255,100,240,${a*.8})`;g.lineWidth=2+a*6;g.lineCap='round';g.beginPath();g.moveTo(trail[i-1].x,trail[i-1].y);g.lineTo(trail[i].x,trail[i].y);g.stroke()}
  g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(mouse.x,mouse.y,8,0,7);g.stroke();
  // particles & judgement
  fx=fx.filter(p=>P-p.t0<p.l);for(const p of fx){const a=(P-p.t0)/1000,k=1-(P-p.t0)/p.l;g.globalAlpha=k;g.fillStyle=p.col;g.fillRect(p.x+p.vx*a-2,p.y+p.vy*a-2,4,4)}g.globalAlpha=1;
  jt=jt.filter(j=>P-j.t0<600);for(const j of jt){const k=(P-j.t0)/600;g.globalAlpha=1-k;txt(j.txt,j.x,j.y-30-k*30,22,j.col);g.globalAlpha=1}
  // HUD
  const pr=Math.max(0,Math.min(1,t/END));
  g.fillStyle='#1a1a2e';g.fillRect(0,0,W,8);const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#00f0ff');gr.addColorStop(1,'#ff3df0');g.fillStyle=gr;g.fillRect(0,0,W*pr,8);
  txt('SCORE '+String(score).padStart(7,'0'),20,46,26,'#fff','left');
  if(combo>1){txt(combo,W/2,H*.3,56,'rgba(255,255,255,.85)','center','#00f0ff');txt('COMBO',W/2,H*.3+26,16,'#00f0ff','center',0)}
  if(t<0)txt(Math.ceil(-t),W/2,H*.5,80,'rgba(255,255,255,.7)');
  const fl=Math.max(0,1-(P-flashT)/350);if(fl>0){g.fillStyle=`rgba(255,235,150,${fl*.45})`;g.fillRect(-20,-20,W+40,H+40)}g.restore();pb={x:W-60,y:14,w:44,h:36};g.strokeStyle='#8890a8';g.lineWidth=2;g.strokeRect(pb.x,pb.y,pb.w,pb.h);g.fillStyle='#8890a8';g.fillRect(pb.x+14,pb.y+9,5,18);g.fillRect(pb.x+25,pb.y+9,5,18);
  if(paused&&resumeAt){const rem=resumeAt-performance.now();if(rem<=0){paused=false;resumeAt=0;ac.resume()}else{g.fillStyle='rgba(5,5,15,.55)';g.fillRect(0,0,W,H);txt(Math.ceil(rem/1000),W/2,H*.5,120,'#ffb000');txt('READY...',W/2,H*.62,22,'#8890a8','center',0)}}
  else if(paused){g.fillStyle='rgba(5,5,15,.78)';g.fillRect(0,0,W,H);txt('PAUSED',W/2,H*.2,48,'#00f0ff');rb={x:W/2-120,y:H*.3,w:240,h:54};qb={x:W/2-120,y:H*.3+66,w:240,h:54};g.lineWidth=3;g.strokeStyle='#ffb000';g.strokeRect(rb.x,rb.y,rb.w,rb.h);g.strokeStyle='#ff3df0';g.strokeRect(qb.x,qb.y,qb.w,qb.h);tb={x:W/2-120,y:H*.3+132,w:240,h:54};g.strokeStyle='#8890a8';g.strokeRect(tb.x,tb.y,tb.w,tb.h);txt('TITLE',W/2,tb.y+36,26,'#8890a8');txt('RESUME',W/2,rb.y+36,26,'#ffb000');txt('RETRY',W/2,qb.y+36,26,'#ff3df0');txt('P / Esc でも再開できるよ',W/2,H*.95,14,'#8890a8','center',0)}
  if(t>END)scene='result';
}
function result(){
  const tot=cnt.p+cnt.g+cnt.m||1,acc=(cnt.p+cnt.g*.7)/tot,rk=acc>=.95?'S':acc>=.85?'A':acc>=.7?'B':acc>=.5?'C':'D';
  const cx=W/2,u=Math.min(1,H/640);
  txt('RESULT',cx,90*u,40*u,'#00f0ff');
  txt(rk,cx,230*u,130*u,rk=='S'?'#ffd84d':'#ff3df0');
  txt('SCORE '+score,cx,285*u,28*u,'#fff');
  txt('PERFECT  '+cnt.p,cx,335*u,22*u,'#fff7a8');txt('GREAT  '+cnt.g,cx,368*u,22*u,'#7dffb0');txt('MISS  '+cnt.m,cx,401*u,22*u,'#ff4d6d');
  txt('MAX COMBO  '+maxc+'   ACC '+(acc*100).toFixed(1)+'%',cx,445*u,20*u,'#c8d0e8');
  btn={x:cx-110,y:480*u,w:220,h:54*u};
  g.strokeStyle='#ffb000';g.lineWidth=3;g.shadowColor='#ffb000';g.shadowBlur=14;g.strokeRect(btn.x,btn.y,btn.w,btn.h);g.shadowBlur=0;
  txt('RETRY',cx,btn.y+btn.h*.67,26*u,'#ffb000');
}
frame();
